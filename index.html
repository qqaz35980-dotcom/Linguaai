<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinguaAI</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">

<meta name="theme-color" content="#0B1F3A">
</head>

<body>

<div class="container">

<h1>🌐 LinguaAI</h1>
<p>Penerjemah Suara Indonesia • English • 中文</p>

<div class="row">
<label>Dari</label>
<select id="fromLang">
<option value="id">🇮🇩 Indonesia</option>
<option value="en">🇺🇸 English</option>
<option value="zh">🇨🇳 中文</option>
</select>
</div>

<div class="swap">
<button id="swapBtn">⇄</button>
</div>

<div class="row">
<label>Ke</label>
<select id="toLang">
<option value="en">🇺🇸 English</option>
<option value="id">🇮🇩 Indonesia</option>
<option value="zh">🇨🇳 中文</option>
</select>
</div>

<button id="micBtn">🎤 Mulai Bicara</button>

<div id="status">Siap digunakan</div>

<textarea id="sourceText" placeholder="Teks asli..." readonly></textarea>

<textarea id="translatedText" placeholder="Hasil terjemahan..." readonly></textarea>

<div class="buttons">
<button id="speakBtn">🔊 Dengarkan</button>
<button id="copyBtn">📋 Salin</button>
</div>

</div>

<script src="app.js"></script>

</body>
</html>
