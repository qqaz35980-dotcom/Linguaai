<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LinguaAI</title>

<link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">

</head>

<body>

<div class="container">

<h1>🌐 LinguaAI</h1>

<p>AI Penerjemah Suara</p>


<div class="card">

<label>Dari Bahasa</label>

<select id="fromLang">

<option value="id">🇮🇩 Indonesia</option>

<option value="en">🇺🇸 English</option>

<option value="zh">🇨🇳 Mandarin</option>

</select>


<button id="swapBtn">
🔄 Tukar Bahasa
</button>


<label>Ke Bahasa</label>

<select id="toLang">

<option value="en">🇺🇸 English</option>

<option value="id">🇮🇩 Indonesia</option>

<option value="zh">🇨🇳 Mandarin</option>

</select>


<button id="micBtn">
🎤 Mulai Bicara
</button>


<div id="status">
Siap digunakan
</div>


<textarea id="sourceText"
placeholder="Kalimat asli...">
</textarea>


<textarea id="translatedText"
placeholder="Hasil terjemahan...">
</textarea>


<div class="buttons">

<button id="speakBtn">
🔊 Dengarkan
</button>

<button id="copyBtn">
📋 Salin
</button>

</div>


</div>

</div>


<script src="app.js"></script>

</body>

</html>
